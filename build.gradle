buildscript {
    repositories { maven { url = 'https://repo.spongepowered.org/repository/maven-public/' } }
    dependencies { classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT' }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '6.0.54'
}

apply plugin: 'org.spongepowered.mixin'

mixin {
    add sourceSets.main, 'eternal_trinkets.refmap.json'
    config 'eternal_trinkets.mixins.json'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"
minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            // Third-party release refmaps use SRG names and must be remapped for
            // the official-named ForgeGradle development runtime.
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile',
                    file("${buildDir}/createSrgToMcp/output.srg").absolutePath
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
            if (project.hasProperty('verifySpecialText')) {
                property 'eternal_trinkets.verifySpecialText', 'true'
            }
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven {
        url = "https://maven.theillusivec4.top/"
    }
    maven {
        name = "GeckoLib"
        url = "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/"
    }
    maven {
        url "https://maven.blamejared.com"
    }
    maven {
        url "https://www.cursemaven.com"
        content { includeGroup "curse.maven" }
    }
}

dependencies {
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    implementation fg.deobf("top.theillusivec4.curios:curios-forge:5.14.1+1.20.1")
    implementation fg.deobf('software.bernie.geckolib:geckolib-forge-1.20.1:4.4.9')
    implementation fg.deobf("curse.maven:enigmatic-legacy-336184:5600004")
    compileOnly fg.deobf("curse.maven:terra-curio-1027625:7449534")
    runtimeOnly fg.deobf("curse.maven:patchouli-306770:7730942")
    runtimeOnly fg.deobf("curse.maven:caelus-308989:5281700")

    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}")
    runtimeOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")

    compileOnly fg.deobf("curse.maven:thirst-was-taken-679270:4750369")
    runtimeOnly fg.deobf("curse.maven:thirst-was-taken-679270:4750369")
}

tasks.named('processResources', ProcessResources).configure {
    from('src/main/resources/assets/eternal_trinkets/textures/item/curio') {
        include '黑色小rock.png'
        rename '黑色小rock.png', 'extinction_stone.png'
        into 'assets/eternal_trinkets/textures/item/curio'
    }
    from('src/main/resources/assets/eternal_trinkets/textures/item/curio') {
        include '黑色bigeye.png'
        rename '黑色bigeye.png', 'hell_eye.png'
        into 'assets/eternal_trinkets/textures/item/curio'
    }
    from('src/main/resources/assets/eternal_trinkets/textures/item/curio') {
        include '大盾.png'
        rename '大盾.png', 'sighing_shield.png'
        into 'assets/eternal_trinkets/textures/item/curio'
    }
    from('src/main/resources/assets/eternal_trinkets/textures/item/curio') {
        include 'jade.png'
        rename 'jade.png', 'jade_bracelet.png'
        into 'assets/eternal_trinkets/textures/item/curio'
    }
    from('src/main/resources/assets/eternal_trinkets/textures/item/curio') {
        include '瞄具.png'
        rename '瞄具.png', 'archer_aiming_scope.png'
        into 'assets/eternal_trinkets/textures/item/curio'
    }
    // User-supplied originals stay untouched in assets/. Publish byte-identical
    // copies at the resource locations expected by the two generated models.
    from('src/main/resources/assets') {
        include 'calamity_quartz.png', 'fortune_quartz.png'
        into 'assets/eternal_trinkets/textures/item'
    }
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'MixinConfigs'            : 'eternal_trinkets.mixins.json',
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    finalizedBy 'reobfJar'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
